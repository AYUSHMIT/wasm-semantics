<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Formal Verification Workflow Diagram -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        fill="#1e293b" text-anchor="middle">Formal Verification Workflow</text>
  
  <!-- Step 1: Source Code -->
  <rect x="50" y="60" width="120" height="60" fill="#667eea" stroke="#4f46e5" stroke-width="2" rx="5"/>
  <text x="110" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="white" text-anchor="middle">1. Write Code</text>
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" 
        text-anchor="middle">WebAssembly</text>
  
  <!-- Arrow 1 -->
  <line x1="170" y1="90" x2="210" y2="90" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Formal Spec -->
  <rect x="210" y="60" width="120" height="60" fill="#10b981" stroke="#059669" stroke-width="2" rx="5"/>
  <text x="270" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="white" text-anchor="middle">2. Define Spec</text>
  <text x="270" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" 
        text-anchor="middle">K Framework</text>
  
  <!-- Arrow 2 -->
  <line x1="270" y1="120" x2="270" y2="160" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Verify -->
  <rect x="210" y="160" width="120" height="60" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="5"/>
  <text x="270" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="white" text-anchor="middle">3. Verify</text>
  <text x="270" y="205" font-family="Arial, sans-serif" font-size="11" fill="white" 
        text-anchor="middle">Symbolic Execution</text>
  
  <!-- Arrow 3a (success) -->
  <line x1="210" y1="190" x2="170" y2="190" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="180" y="185" font-family="Arial, sans-serif" font-size="10" fill="#10b981">✓ Proof</text>
  
  <!-- Arrow 3b (failure) -->
  <line x1="330" y1="190" x2="370" y2="190" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="185" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">✗ Bug</text>
  
  <!-- Success Box -->
  <rect x="50" y="160" width="120" height="60" fill="#10b981" stroke="#059669" stroke-width="2" rx="5"/>
  <text x="110" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="white" text-anchor="middle">✓ Verified</text>
  <text x="110" y="205" font-family="Arial, sans-serif" font-size="11" fill="white" 
        text-anchor="middle">Correctness Proof</text>
  
  <!-- Failure Box -->
  <rect x="370" y="160" width="120" height="60" fill="#ef4444" stroke="#dc2626" stroke-width="2" rx="5"/>
  <text x="430" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="white" text-anchor="middle">✗ Bug Found</text>
  <text x="430" y="205" font-family="Arial, sans-serif" font-size="11" fill="white" 
        text-anchor="middle">Counterexample</text>
  
  <!-- Loop back arrow from bug -->
  <path d="M 430 220 L 430 260 L 110 260 L 110 120" stroke="#ef4444" stroke-width="2" 
        fill="none" marker-end="url(#arrowhead)"/>
  <text x="270" y="275" font-family="Arial, sans-serif" font-size="10" fill="#64748b" 
        text-anchor="middle">Fix and retry</text>
  
  <!-- Benefits box -->
  <rect x="50" y="290" width="440" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="5"/>
  <text x="270" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
        fill="#1e293b" text-anchor="middle">Benefits</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    • Proves correctness for ALL inputs (not just tests)
  </text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    • Finds subtle bugs before production
  </text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    • Provides mathematical certainty of security properties
  </text>
</svg>
