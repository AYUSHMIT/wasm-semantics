<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- WebAssembly Stack Machine Architecture Diagram -->
  <defs>
    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc1ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        fill="#1e293b" text-anchor="middle">WebAssembly Stack Machine</text>
  
  <!-- Stack -->
  <rect x="50" y="60" width="100" height="200" fill="none" stroke="#0066cc" stroke-width="2"/>
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="14" fill="#1e293b" 
        text-anchor="middle">Stack</text>
  
  <!-- Stack items -->
  <rect x="55" y="220" width="90" height="35" fill="url(#stackGrad)" stroke="#0066cc"/>
  <text x="100" y="240" font-family="monospace" font-size="12" fill="white" text-anchor="middle">i32: 42</text>
  
  <rect x="55" y="180" width="90" height="35" fill="url(#stackGrad)" stroke="#0066cc"/>
  <text x="100" y="200" font-family="monospace" font-size="12" fill="white" text-anchor="middle">i32: 10</text>
  
  <!-- Memory -->
  <rect x="180" y="60" width="150" height="200" fill="#f8fafc" stroke="#0066cc" stroke-width="2"/>
  <text x="255" y="50" font-family="Arial, sans-serif" font-size="14" fill="#1e293b" 
        text-anchor="middle">Linear Memory</text>
  
  <!-- Memory grid -->
  <g font-family="monospace" font-size="10" fill="#64748b">
    <text x="190" y="80">0x0000: 00 00 00 00</text>
    <text x="190" y="100">0x0004: 2A 00 00 00</text>
    <text x="190" y="120">0x0008: 00 00 00 00</text>
    <text x="190" y="140">0x000C: 00 00 00 00</text>
    <text x="190" y="160">...</text>
  </g>
  
  <!-- Instructions -->
  <rect x="50" y="270" width="280" height="20" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="190" y="284" font-family="monospace" font-size="12" fill="#1e293b" 
        text-anchor="middle">(i32.const 42) (i32.const 10) (i32.add)</text>
</svg>
